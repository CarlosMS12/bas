# Netlify configuration for React + Vite + Supabase

[build]
  # Comando de build
  command = "npm run build"
  
  # Directorio de salida
  publish = "dist"

# Configuración de SPA (Single Page Application)
# Redirige todas las rutas al index.html para que React Router funcione
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Variables de entorno (configurar en Netlify UI)
# VITE_SUPABASE_URL = https://fnoebgtfnfecpgajzjpe.supabase.co
# VITE_SUPABASE_ANON_KEY = tu_anon_key_aqui
